name: Publish to Factorio Mod Portal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_mod:
        description: "Mod directory to package/publish (required)"
        required: true
        type: string
      confirm:
        description: "Type PUBLISH to upload; leave empty to only package (dry-run)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# Publishing is irreversible (the Mod Portal does not delete releases), so never
# run two publish jobs at the same time.
concurrency:
  group: mod-portal-publish
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target: ${{ steps.meta.outputs.target }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A release must package the tagged commit, not the branch head.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Resolve target mod and version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_TARGET: ${{ inputs.target_mod }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from mod_utils import parse_tag

          event = os.environ.get("EVENT_NAME", "")
          tag = (os.environ.get("TAG_NAME") or "").strip()
          target = (os.environ.get("INPUT_TARGET") or "").strip()

          if event == "release":
              if not tag:
                  raise SystemExit("release 事件缺少 tag_name")
              target, version = parse_tag(tag)
          else:
              if not target:
                  raise SystemExit("workflow_dispatch 必须提供 target_mod")
              tag = ""
              version = ""

          info_path = Path(target) / "src" / "info.json"
          if not info_path.is_file():
              raise SystemExit(f"未找到模组目录: {info_path}")
          if target == "example-mod":
              raise SystemExit("拒绝发布 example-mod（模板示例模组）")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"target={target}\n")
              fh.write(f"tag={tag}\n")
              fh.write(f"version={version}\n")
          PY

      - name: Verify sources
        env:
          TARGET: ${{ steps.meta.outputs.target }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            python3 verify_mod.py --target "$TARGET" --tag "$TAG"
          else
            python3 verify_mod.py --target "$TARGET"
          fi

      - name: Package
        env:
          TARGET_MOD: ${{ steps.meta.outputs.target }}
          MOD_OUTPUT_DIR: dist
        run: python3 pack_mods.py

      - name: Verify packaged zips
        env:
          TARGET: ${{ steps.meta.outputs.target }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            python3 verify_mod.py --zip-dir dist --target "$TARGET" --tag "$TAG"
          else
            python3 verify_mod.py --zip-dir dist --target "$TARGET"
          fi

      - name: Upload zips as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-zips
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Upload to Mod Portal
    needs: package
    if: ${{ (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'PUBLISH') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers on this environment before the first publish.
    environment: mod-portal-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download zips
        uses: actions/download-artifact@v4
        with:
          name: mod-zips
          path: dist

      - name: Publish
        env:
          FACTORIO_TOKEN: ${{ secrets.FACTORIO_TOKEN }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            python3 scripts/publish_mod.py --zip-dir dist --tag "$TAG"
          else
            python3 scripts/publish_mod.py --zip-dir dist
          fi
